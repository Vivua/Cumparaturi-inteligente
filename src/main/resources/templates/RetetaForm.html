<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaugă Rețetă</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="back-button mb-3">
        <a href="http://localhost/Meniu#" class="btn btn-secondary">&larr; Înapoi la Meniu</a>
    </div>

    <h1 class="text-center">Adaugă o rețetă nouă</h1>
    <form th:action="@{/save}" th:object="${reteta}" method="post" class="mt-4">

        <div class="mb-3">
            <label for="nume" class="form-label">Nume:</label>
            <input type="text" class="form-control" id="nume" th:field="*{nume}" placeholder="Nume rețetă" required>
        </div>

        <div class="mb-3">
            <label for="categorie" class="form-label">Categorie:</label>
            <input type="text" class="form-control" id="categorie" th:field="*{categorie}" placeholder="Categorie" required>
        </div>

        <div class="mb-3">
            <label for="descriere" class="form-label">Descriere:</label>
            <textarea class="form-control" id="descriere" th:field="*{descriere}" rows="3" placeholder="Descriere rețetă"></textarea>
        </div>

        <div class="mb-3">
            <label for="ingredient" class="form-label">Ingredient:</label>
            <input type="text" class="form-control" id="ingredient" placeholder="Nume ingredient">
        </div>

        <div class="mb-3">
            <label for="cantitate" class="form-label">Cantitate:</label>
            <input type="number" step="0.01" class="form-control" id="cantitate" placeholder="Cantitate">
        </div>

        <div class="mb-3">
            <label for="pret" class="form-label">Preț:</label>
            <input type="number" step="0.01" class="form-control" id="pret" placeholder="Preț">
        </div>

        <button type="button" class="btn btn-secondary mb-3" onclick="addIngredient()">Adaugă Ingredient</button>

        <ul id="ingredientsList" class="list-group mb-3">
            <!-- Ingredientele deja existente (dacă există) -->
            <li th:each="ingredient, iterStat : ${reteta.ingredients}" class="list-group-item">
                <span th:text="${ingredient.name}">Nume</span>:
                <span th:text="${ingredient.quantity}">Cantitate</span>,
                <span th:text="${ingredient.pret}">Preț</span>

                <input type="hidden" th:field="*{ingredients[__${iterStat.index}__].name}" th:value="${ingredient.name}">
                <input type="hidden" th:field="*{ingredients[__${iterStat.index}__].quantity}" th:value="${ingredient.quantity}">
                <input type="hidden" th:field="*{ingredients[__${iterStat.index}__].pret}" th:value="${ingredient.pret}">
            </li>
        </ul>

        <div class="mb-3">
            <label for="timp" class="form-label">Timp (minute):</label>
            <input type="number" class="form-control" id="timp" th:field="*{timp}" placeholder="Timp de preparare">
        </div>

        <button type="submit" class="btn btn-primary">Salvează Rețeta</button>
    </form>
</div>

<script>
    let ingredientIndex = document.querySelectorAll("#ingredientsList li").length;

    function addIngredient() {
        const ingredientInput = document.getElementById("ingredient");
        const cantitateInput = document.getElementById("cantitate");
        const pretInput = document.getElementById("pret");

        const ingredient = ingredientInput.value.trim();
        const cantitate = cantitateInput.value.trim();
        const pret = pretInput.value.trim();

        if (ingredient && cantitate && pret) {
            const list = document.getElementById("ingredientsList");
            const li = document.createElement("li");
            li.classList.add("list-group-item");

            // Text vizibil
            li.innerHTML = `
                ${ingredient}: ${cantitate} unități, preț: ${pret} lei
                <input type="hidden" name="ingredients[${ingredientIndex}].name" value="${ingredient}">
                <input type="hidden" name="ingredients[${ingredientIndex}].quantity" value="${cantitate}">
                <input type="hidden" name="ingredients[${ingredientIndex}].pret" value="${pret}">
            `;

            list.appendChild(li);

            ingredientIndex++;

            ingredientInput.value = "";
            cantitateInput.value = "";
            pretInput.value = "";
        } else {
            alert("Completați toate câmpurile pentru ingredient, cantitate și preț.");
        }
    }
</script>
</body>
</html>
