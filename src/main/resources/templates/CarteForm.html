<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaugă Carte de Bucate</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #e63946;
            --secondary-color: #f1faee;
            --accent-color: #a8dadc;
            --dark-color: #1d3557;
            --light-color: #f8f9fa;
        }

        body {
            background-color: var(--light-color);
            font-family: 'Montserrat', sans-serif;
            color: #333;
            background-image: url('https://images.unsplash.com/photo-1547592180-85f173990554?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            position: relative;
            padding-top: 40px;
            padding-bottom: 40px;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            z-index: -1;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 700px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.3rem;
            font-weight: 700;
            color: var(--dark-color);
            margin-bottom: 30px;
            text-align: center;
            position: relative;
            padding-bottom: 15px;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 3px;
            background: var(--primary-color);
        }

        .form-label {
            font-weight: 600;
            color: var(--dark-color);
            margin-bottom: 8px;
        }

        .form-control {
            border-radius: 8px;
            border: 1px solid #ced4da;
            padding: 12px 15px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(230, 57, 70, 0.25);
        }

        textarea.form-control {
            min-height: 120px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            padding: 10px 30px;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .btn-primary:hover {
            background-color: #c1121f;
            border-color: #c1121f;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: var(--dark-color);
            border-color: var(--dark-color);
            margin-bottom: 30px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background-color: #14213d;
            border-color: #14213d;
            transform: translateY(-2px);
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            accent-color: var(--primary-color);
            position: relative;
            top: 3px;
        }

        .checkbox-label {
            font-weight: 400;
            color: #495057;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .checkbox-label:hover {
            color: var(--primary-color);
        }

        .recipes-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .recipe-item {
            background: #f8f9fa;
            padding: 12px 15px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-color);
            transition: all 0.3s ease;
        }

        .recipe-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
                margin: 20px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .recipes-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- Buton pentru navigare înapoi -->
    <div class="back-button">
        <a href="http://localhost/Meniu#" class="btn btn-secondary">
            <i class="fas fa-arrow-left me-2"></i>Înapoi la Meniu
        </a>
    </div>

    <h1><i class="fas fa-book me-2"></i>Adaugă Carte de Bucate</h1>

    <form th:action="@{/saveCarte}" th:object="${carteDeBucate}" method="post" class="mt-4">

        <!-- Nume Autor -->
        <div class="mb-4">
            <label for="NumeAutor" class="form-label">
                <i class="fas fa-user me-2"></i>Nume Autor:
            </label>
            <input type="text" class="form-control" id="NumeAutor" th:field="*{numeAutor}" placeholder="Introdu numele autorului" required>
        </div>

        <!-- Titlu Carte -->
        <div class="mb-4">
            <label for="TitluCarte" class="form-label">
                <i class="fas fa-heading me-2"></i>Titlu Carte:
            </label>
            <input type="text" class="form-control" id="TitluCarte" th:field="*{titluCarte}" placeholder="Introdu titlul cărții" required>
        </div>

        <!-- Descriere Carte -->
        <div class="mb-4">
            <label for="DescriereCarte" class="form-label">
                <i class="fas fa-align-left me-2"></i>Descriere:
            </label>
            <textarea class="form-control" id="DescriereCarte" th:field="*{descriereCarte}" rows="4" placeholder="Introdu descrierea cărții" required></textarea>
        </div>

        <!-- Selectează Rețete -->
        <div class="mb-4">
            <label th:for="retete" class="form-label">
                <i class="fas fa-utensils me-2"></i>Selectează Rețete:
            </label>
            <div class="recipes-container">
                <!-- Afișează toate rețetele disponibile ca checkbox-uri -->
                <div class="recipe-item" th:each="reteta : ${retete}">
                    <input type="checkbox" th:id="'reteta_' + ${reteta.id}" th:field="*{retete}" th:value="${reteta.id}">
                    <label class="checkbox-label" th:for="'reteta_' + ${reteta.id}" th:text="${reteta.nume}"></label>
                </div>
            </div>
        </div>

        <!-- Pret -->
        <div class="mb-4">
            <label for="pret" class="form-label">
                <i class="fas fa-tag me-2"></i>Preț:
            </label>
            <div class="input-group">
                <span class="input-group-text">RON</span>
                <input type="number" class="form-control" id="pret" th:field="*{pret}" placeholder="Introdu prețul" required>
            </div>
        </div>

        <!-- Buton Submit -->
        <div class="text-center">
            <button type="submit" class="btn btn-primary btn-lg">
                <i class="fas fa-save me-2"></i>Salvează Carte
            </button>
        </div>
    </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
